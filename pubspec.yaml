name: rentit
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.18+18

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  dio: ^5.9.2
  http: ^1.6.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  flutter_svg: ^2.2.4
  razorpay_flutter: ^1.4.1
  google_maps_flutter: ^2.17.0
  dropdown_button2: ^2.3.9
  record: ^6.2.0
  path_provider: ^2.1.5
  http_parser: ^4.1.2
  speech_to_text: ^7.3.0
  socket_io_client: ^3.1.4
  typed_data: ^1.4.0
  cupertino_icons: ^1.0.9
  app_settings: ^7.0.0
  just_audio: ^0.9.40
  video_player: ^2.9.1
  share_plus: ^10.1.3
  app_links: ^6.1.1
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/app_logo.png

  android_12:
    image: assets/app_logo.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/FullDetailScreen/
    - assets/Click_NavBar/
    - assets/Unclick_NavBar/
    - assets/apartment/
    - assets/bhk/
    - assets/floating_icon/